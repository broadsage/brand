<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Broadsage Micro Glyph: Engineered for 16px, 24px, 32px Favicons, IDEs & Status Bars -->
  <defs>
    <linearGradient id="microNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0A1128"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0A1128"/>
  <g transform="translate(32, 33)">
    <!-- High-visibility geometric ear crests -->
    <polygon points="-16,-22 -7,-9 -18,-9" fill="#0284C7"/>
    <polygon points="16,-22 7,-9 18,-9" fill="#F59E0B"/>

    <!-- Main Body Silhouette -->
    <ellipse cx="0" cy="3" rx="19" ry="21" fill="url(#microNavy)" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Solar Belly Shield -->
    <ellipse cx="0" cy="7" rx="11" ry="14" fill="#F59E0B"/>
    <path d="M-4,4 L0,7 L4,4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M-4,9 L0,12 L4,9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- High-Contrast Bold Eyes & Wisdom Frames -->
    <circle cx="-8" cy="-5" r="7.5" fill="#082F49" stroke="#0284C7" stroke-width="2"/>
    <circle cx="-8" cy="-5" r="4.5" fill="#FCD34D"/>
    <circle cx="-9.5" cy="-6.5" r="1.5" fill="#FFFFFF"/>

    <circle cx="8" cy="-5" r="7.5" fill="#451A03" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="8" cy="-5" r="4.5" fill="#FCD34D"/>
    <circle cx="6.5" cy="-6.5" r="1.5" fill="#FFFFFF"/>

    <!-- Frame Bridge -->
    <rect x="-2" y="-6" width="4" height="2" rx="1" fill="#FFFFFF"/>

    <!-- Beak -->
    <polygon points="0,-1 2.5,4 0,6 -2.5,4" fill="#FDE68A"/>

    <!-- Perch Claws -->
    <ellipse cx="-6" cy="24" rx="3" ry="1.8" fill="#FBBF24"/>
    <ellipse cx="6" cy="24" rx="3" ry="1.8" fill="#FBBF24"/>
  </g>
</svg>

