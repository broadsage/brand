name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Checkout repo only if a new release was cut (PR merged)
      - name: Checkout Code
        uses: actions/checkout@v7
        if: ${{ steps.release.outputs.releases_created }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.releases_created }}
        with:
          node-version: 24

      - name: Build Brand Asset Pack
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          npm ci
          npm run build:pack

      - name: Upload Brand Kit to GitHub Release
        if: ${{ steps.release.outputs.releases_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.release.outputs.tag_name }} public/broadsage-brand-assets.zip --clobber
