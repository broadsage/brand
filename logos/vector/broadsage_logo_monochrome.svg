<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="p4Belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="#0B0F19"/>
  <g transform="translate(100, 100)">
    <!-- High-Contrast Ear Crests -->
    <polygon points="-48,-66 -22,-32 -54,-32" fill="#FFFFFF"/>
    <polygon points="48,-66 22,-32 54,-32" fill="#10B981"/>

    <!-- Main Owl Body in Sleek Slate -->
    <ellipse cx="0" cy="8" rx="56" ry="62" fill="url(#p4Body)" stroke="#334155" stroke-width="2"/>

    <!-- Wings -->
    <path d="M-56,2 C-66,24 -52,58 -32,66 C-42,44 -46,20 -56,2 Z" fill="#1E293B"/>
    <path d="M56,2 C66,24 52,58 32,66 C42,44 46,20 56,2 Z" fill="#047857"/>

    <!-- Pure Crisp White Belly Shield -->
    <ellipse cx="0" cy="22" rx="32" ry="40" fill="url(#p4Belly)"/>
    <path d="M-12,12 L0,20 L12,12" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M-14,26 L0,34 L14,26" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M-12,40 L0,48 L12,40" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>

    <!-- Sharp Monoline Glasses & Emerald Eye Accent -->
    <circle cx="-22" cy="-18" r="19" fill="#0B0F19" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="-22" cy="-18" r="12" fill="#10B981"/>
    <circle cx="-25" cy="-21" r="4.5" fill="#FFFFFF"/>

    <circle cx="22" cy="-18" r="19" fill="#0B0F19" stroke="#10B981" stroke-width="4"/>
    <circle cx="22" cy="-18" r="12" fill="#10B981"/>
    <circle cx="19" cy="-21" r="4.5" fill="#FFFFFF"/>

    <rect x="-6" y="-20" width="12" height="4" rx="2" fill="#FFFFFF"/>

    <!-- Minimalist Pure White Beak -->
    <polygon points="0,-6 7,8 0,14 -7,8" fill="#FFFFFF"/>
    <polygon points="0,-6 0,14 7,8" fill="#CBD5E1"/>

    <!-- Claws -->
    <ellipse cx="-16" cy="70" rx="7" ry="4" fill="#FFFFFF"/>
    <ellipse cx="16" cy="70" rx="7" ry="4" fill="#FFFFFF"/>
  </g>
</svg>