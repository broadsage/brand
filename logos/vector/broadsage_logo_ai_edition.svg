<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Neural Glow Gradients -->
    <linearGradient id="aiBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="80%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="neuralMint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="sensorIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </radialGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="#090D16"/>
  <!-- Ollie: AI Agent Edition -->
  <g transform="translate(100, 100)">
    <!-- Floating AI Halo Spark / Neural Antenna -->
    <circle cx="0" cy="-74" r="4" fill="#38BDF8" filter="url(#aiGlow)"/>
    <line x1="0" y1="-70" x2="0" y2="-56" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="2,2"/>

    <!-- Ear Crests with Electric Cyan & Mint Neurons -->
    <polygon points="-48,-66 -22,-32 -54,-32" fill="#38BDF8"/>
    <circle cx="-35" cy="-48" r="3" fill="#FFFFFF"/>
    <polygon points="48,-66 22,-32 54,-32" fill="#10B981"/>
    <circle cx="35" cy="-48" r="3" fill="#FFFFFF"/>

    <!-- Main Owl Body (Synthetic Neural Slate) -->
    <ellipse cx="0" cy="8" rx="56" ry="62" fill="url(#aiBodyGrad)" stroke="#1E293B" stroke-width="2"/>

    <!-- Deep Wings (Holding the Platform) -->
    <path d="M-56,2 C-66,24 -52,58 -32,66 C-42,44 -46,20 -56,2 Z" fill="#1E1B4B"/>
    <path d="M56,2 C66,24 52,58 32,66 C42,44 46,20 56,2 Z" fill="#064E3B"/>

    <!-- Transformer Layer Tokens / Code Attention Chevrons on Belly Shield -->
    <ellipse cx="0" cy="22" rx="32" ry="40" fill="url(#neuralMint)"/>
    <!-- Token Execution Chevrons -->
    <path d="M-12,12 L0,20 L12,12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M-14,26 L0,34 L14,26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M-12,40 L0,48 L12,40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- MULTI-MODAL OPTICAL SENSOR LENSES (AI Eyes) -->
    <!-- Left Sensor -->
    <circle cx="-22" cy="-18" r="20" fill="#0B0F19" stroke="#38BDF8" stroke-width="4.5" filter="url(#aiGlow)"/>
    <circle cx="-22" cy="-18" r="13" fill="url(#sensorIris)"/>
    <circle cx="-25" cy="-21" r="5" fill="#FFFFFF"/>

    <!-- Right Sensor -->
    <circle cx="22" cy="-18" r="20" fill="#0B0F19" stroke="#34D399" stroke-width="4.5"/>
    <circle cx="22" cy="-18" r="13" fill="url(#sensorIris)"/>
    <circle cx="19" cy="-21" r="5" fill="#FFFFFF"/>

    <!-- Frame Bridge with Central Processing Core -->
    <rect x="-6" y="-20" width="12" height="4" rx="2" fill="#FFFFFF"/>
    <circle cx="0" cy="-18" r="2.5" fill="#38BDF8"/>

    <!-- Precision Sensor Beak -->
    <polygon points="0,-6 7,8 0,14 -7,8" fill="#38BDF8"/>
    <polygon points="0,-6 0,14 7,8" fill="#0284C7"/>

    <!-- Ground Platform Claws -->
    <ellipse cx="-16" cy="70" rx="7" ry="4" fill="#34D399"/>
    <ellipse cx="16" cy="70" rx="7" ry="4" fill="#34D399"/>
  </g>
</svg>